aid: plumery
name: Plumery
description: 'Plumery is an Amsterdam, Netherlands-based fintech that provides a headless,
  mobile-first digital banking engagement platform it markets as the "Digital Success
  Fabric" — a "Digital Engagement Platform for Banks." It lets banks, credit unions,
  and financial institutions build and launch branded mobile and web banking experiences
  on top of their existing core banking systems, delivered to engineering teams as
  an API-first, composable platform with SDKs and developer documentation (built on
  the Stainless docs/SDK toolchain). Plumery maintains a public GitHub organization
  of supporting engineering tooling and publishes a security & compliance program
  (SOC 2, ISO 27001). The company is backed by QED Investors and Seedcamp.'
